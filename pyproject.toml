[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autofix-ci"
version = "1.0.0"
description = "Autonomous CI failure triage, AST static analysis, Gemini patch synthesis, and sandboxed PR generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chunduri Sushen", email = "sushen.chunduri@example.com" }
]
keywords = ["github-actions", "autofix", "ci-cd", "ast", "llm", "gemini", "self-healing"]
dependencies = [
    "google-genai>=2.0.0",
    "PyGithub>=2.1.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
]

[project.scripts]
autofix-ci = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["sample_broken_repo"]
pythonpath = ["."]
